name: Frontend CI/CD (Vercel)

on:
  push:
    branches:
      - main
    paths:
      - 'vayux-v2/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'vayux-v2/**'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Continuous Integration: TypeCheck & Next.js Production Build
  # =========================================================================
  frontend-ci:
    name: Test & Build Next.js Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vayux-v2

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vayux-v2/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.vayux.systems' }}
          NEXT_TELEMETRY_DISABLED: 1

  # =========================================================================
  # 2. Continuous Deployment: Deploy to Vercel on Merge to Main
  # =========================================================================
  frontend-cd:
    name: Deploy Frontend to Vercel
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (CLI / Action)
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./vayux-v2
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Trigger Vercel Deploy Hook (Alternative)
        if: env.VERCEL_DEPLOY_HOOK_URL != '' && env.VERCEL_TOKEN == ''
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Vercel deploy hook triggered!"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Deployment Notice
        if: env.VERCEL_TOKEN == '' && env.VERCEL_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice ::Vercel credentials (VERCEL_TOKEN or VERCEL_DEPLOY_HOOK_URL) are not set in GitHub Secrets. If your Vercel project is connected to this GitHub repo directly, Vercel will automatically deploy on push to main."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
