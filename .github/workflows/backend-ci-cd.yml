name: Backend CI/CD (Render)

on:
  push:
    branches:
      - main
    paths:
      - 'backend-v2/**'
      - '.github/workflows/backend-ci-cd.yml'
      - 'render.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend-v2/**'
      - '.github/workflows/backend-ci-cd.yml'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Continuous Integration: Test, Validate & Build Sanity
  # =========================================================================
  backend-ci:
    name: Test & Validate Django Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-v2/backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend-v2/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check (Production Configuration)
        run: |
          python manage.py check --settings=config.settings.production
        env:
          SECRET_KEY: ci-test-secret-key-for-github-actions-at-least-50-chars-long
          FIELD_ENCRYPTION_KEY: r0h1tV4yuX53nt1n3lK3y32Byt35L0ngS3cur3==
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,.onrender.com'

      - name: Migration Sanity Check (Detect uncommitted migrations)
        run: |
          python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-test-secret-key-for-github-actions-at-least-50-chars-long
          FIELD_ENCRYPTION_KEY: r0h1tV4yuX53nt1n3lK3y32Byt35L0ngS3cur3==

      - name: Run Automated Test Suite (22 Unit & Integration Tests)
        run: |
          python manage.py test
        env:
          SECRET_KEY: ci-test-secret-key-for-github-actions-at-least-50-chars-long
          FIELD_ENCRYPTION_KEY: r0h1tV4yuX53nt1n3lK3y32Byt35L0ngS3cur3==
          DEBUG: 'False'

      - name: Collect Static Files Test (WhiteNoise Compression)
        run: |
          python manage.py collectstatic --no-input
        env:
          SECRET_KEY: ci-test-secret-key-for-github-actions-at-least-50-chars-long
          FIELD_ENCRYPTION_KEY: r0h1tV4yuX53nt1n3lK3y32Byt35L0ngS3cur3==

  # =========================================================================
  # 2. Continuous Deployment: Trigger Render Auto-Deploy on Merge to Main
  # =========================================================================
  backend-cd:
    name: Deploy Backend to Render
    needs: backend-ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub Repository Secrets. Render will still auto-deploy if connected via GitHub repository integration."
          else
            echo "Triggering deployment on Render..."
            response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "Render response: $body (HTTP $http_code)"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Deploy request accepted by Render successfully!"
            else
              echo "::error ::Failed to trigger Render deployment. HTTP code: $http_code"
              exit 1
            fi
          fi
